<title>回到过去 · 示波器时钟</title>
<style>
  :root { --phos: #3DFF8C; --muted: #1B8A4D; --bg: #02120A; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: var(--phos);
    font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px 8px; gap: 12px;
  }
  h1 { font-size: 20px; letter-spacing: 2px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.7; }
  .frame {
    position: relative; width: 300px; height: 400px;
    border: 1px solid #0E4A28; border-radius: 18px;
    background: var(--bg); box-shadow: 0 0 40px rgba(61,255,140,.18);
  }
  canvas { width: 300px; height: 400px; border-radius: 18px; touch-action: manipulation; }
  #sleepcover {
    position: absolute; inset: 0; border-radius: 18px; background: #000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; font-size: 15px; color: #1B8A4D; cursor: pointer;
  }
  #sleepcover .wake { color: #3DFF8C; font-size: 13px; animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .btn {
    background: #0A2E1A; color: var(--phos); border: 1px solid #1F7A45;
    border-radius: 999px; padding: 9px 26px; font-size: 15px; letter-spacing: 2px;
    cursor: pointer; font-family: inherit;
  }
  .btn:active { background: #1F7A45; }
  footer { color: var(--muted); font-size: 11px; margin-top: 4px; }
</style>

// ---------- 与固件 clock_core 同源的仪式数学 ----------
function ceremonyPhase(t){
  if (t < 2000) return 0;   // ENTER
  if (t < 8000) return 1;   // ACCEL
  if (t < 10000) return 2;  // FLARE
  if (t < 11000) return 3;  // FREEZE
  if (t < 14000) return 4;  // RETURN
  return 5;                 // DONE
}
function ceremonyVirtualMs(t){
  if (t >= 10000) return 332000;
  if (t >= 8000) return 212000 + 60 * (t - 8000);
  if (t >= 2000) { const u = t - 2000; return 8000 + 8 * u + (26 * u * u) / 6000; }
  return (4 * t * t) / 2000;
}
function mod3600(v){ return ((v % 3600) + 3600) % 3600; }
function handAngle(start, num, den, vms){
  const delta = Math.round(num * vms / 1000 / den);
  return mod3600(start + delta);
}
function lerpAngle(a, b, n, den){
  a = mod3600(a); b = mod3600(b);
  let diff = b - a;
  if (diff > 1800) diff -= 3600; else if (diff < -1800) diff += 3600;
  if (n >= den) return b;
  return mod3600(a + Math.round(diff * n / den));
}
// 真实时间 → 表盘(顺时针角,0.1°)
function faceOf(d){
  const h24 = d.getHours(), m = d.getMinutes(), s = d.getSeconds(), ms = d.getMilliseconds();
  const h12 = (h24 % 12) || 12;
  const sf = s + ms / 1000;
  return {
    h12, pm: h24 >= 12, m, s, ms,
    hourCw: mod3600((h12 % 12) * 300 + m * 5 + sf / 12),
    minCw: mod3600(m * 60 + sf),
    secCw: mod3600(sf * 60),
  };
}
// 报时词序(与固件 clock_announce_words 同源)
function announceWords(f){
  const w = [];
  w.push('now', f.pm ? 'pm' : 'am');
  const d = ['ling','yi','er','san','si','wu','liu','qi','ba','jiu'];
  if (f.h12 <= 9) w.push(d[f.h12]);
  else { w.push('shi'); if (f.h12 === 11) w.push('yi'); else if (f.h12 === 12) w.push('er'); }
  w.push('dian');
  if (f.m === 0) w.push('zheng');
  else if (f.m <= 9) { w.push('ling', d[f.m], 'fen'); }
  else if (f.m === 10) { w.push('shi', 'fen'); }
  else if (f.m < 20) { w.push('shi', d[f.m % 10], 'fen'); }
  else { w.push(d[Math.floor(f.m / 10)], 'shi'); if (f.m % 10) w.push(d[f.m % 10]); w.push('fen'); }
  return w;
}

// ---------- 音频 ----------
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null, buffers = {};
function b64ToBuf(b64){
  const bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}
async function loadAudio(){
  actx = actx || new AC();
  for (const k of Object.keys(AUDIO64)) {
    const ab = await actx.decodeAudioData(b64ToBuf(AUDIO64[k]));
    buffers[k] = ab;
  }
}
function playBuffer(name, when){
  const src = actx.createBufferSource();
  src.buffer = buffers[name];
  src.connect(actx.destination);
  src.start(when);
  return src.buffer.duration;
}
function playSequence(names){
  if (!actx) return;
  let t = actx.currentTime + 0.02;
  for (const n of names) {
    if (buffers[n]) { t += playBuffer(n, t) + 0.08; }
  }
}

// ---------- 状态 ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const sleepCover = document.getElementById('sleepcover');
let ceremony = null;          // {startMs, base:[..], frozen:[..], target:[..], current:[..], lastPhase, phrase}
let screenOff = false;
let lastActivity = performance.now();
let flashOn = false;

function nowFace(){ return faceOf(new Date()); }
function startCeremony(){
  const f = nowFace();
  ceremony = { startMs: performance.now(), base:[f.hourCw, f.minCw, f.secCw],
               frozen:[0,0,0], target:[0,0,0], current:[f.hourCw, f.minCw, f.secCw],
               lastPhase:-1, phrase:'' };
  playSequence(['sfx_rewind']);
}
function endCeremony(){
  ceremony = null;
  flashOn = false;
}
function ceremonyTick(t){
  const phase = ceremonyPhase(t);
  const p = ceremony;
  if (phase !== p.lastPhase) {
    if (phase === 3) {
      const vms = ceremonyVirtualMs(t);
      p.frozen = [ handAngle(p.base[0], -10, 1, vms),
                   handAngle(p.base[1], -20, 1, vms),
                   handAngle(p.base[2], -60, 1, vms) ];
      p.current = p.frozen.slice();
      playSequence(['sfx_ding']);
      p.phrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
    } else if (phase === 4) {
      const f = nowFace();
      p.target = [f.hourCw, f.minCw, f.secCw];
      p.phrase = '';
    } else if (phase === 5) {
      endCeremony();
    }
    p.lastPhase = phase;
    if (!ceremony) return;
  }
  if (phase === 0 || phase === 1 || phase === 2) {
    const vms = ceremonyVirtualMs(t);
    p.current = [ handAngle(p.base[0], -10, 1, vms),
                  handAngle(p.base[1], -20, 1, vms),
                  handAngle(p.base[2], -60, 1, vms) ];
  } else if (phase === 3) {
    // 急停:保持冻结角度
  } else if (phase === 4) {
    const n = t - 11000, den = 3000;
    p.current = [ lerpAngle(p.frozen[0], p.target[0], n, den),
                  lerpAngle(p.frozen[1], p.target[1], n, den),
                  lerpAngle(p.frozen[2], p.target[2], n, den) ];
  }
}

// ---------- 绘制 ----------
function rrect(x, y, w, h, r){ // 圆角矩形路径
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawHands(hA, mA, sA){
  const hands = [
    { a: hA, len: 52, w: 8, c: COL.hour, glow: 13 },
    { a: mA, len: 82, w: 5, c: COL.minute, glow: 10 },
    { a: sA, len: 72, w: 3, c: COL.second, glow: 8 },
  ];
  for (const h of hands) {
    const rad = h.a * Math.PI / 1800;           // 0.1° → 弧度
    const dx = Math.sin(rad), dy = -Math.cos(rad);
    ctx.save();
    ctx.shadowColor = h.c; ctx.shadowBlur = 10;
    ctx.strokeStyle = h.c; ctx.lineWidth = h.w; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(DIAL_CX, DIAL_CY);
    ctx.lineTo(DIAL_CX + dx * h.len, DIAL_CY + dy * h.len);
    ctx.stroke();
    ctx.restore();
  }
  // 中心帽
  ctx.save();
  ctx.shadowColor = COL.second; ctx.shadowBlur = 8;
  ctx.fillStyle = COL.second;
  ctx.beginPath(); ctx.arc(DIAL_CX, DIAL_CY, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function draw(hands){  // hands = [hA, mA, sA](仪式期间)或 null(用真实时间)
  const f = nowFace();
  const inCeremony = !!ceremony;
  const hA = hands ? hands[0] : f.hourCw;
  const mA = hands ? hands[1] : f.minCw;
  const sA = hands ? hands[2] : f.secCw;
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);

  // 表盘
  ctx.fillStyle = COL.dial;
  ctx.beginPath(); ctx.arc(DIAL_CX, DIAL_CY, DIAL_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = COL.ring; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(DIAL_CX, DIAL_CY, DIAL_R, 0, Math.PI * 2); ctx.stroke();

  // 网格 + 内圈
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    if (!i) continue;
    const x = DIAL_CX + i * 30, y = DIAL_CY + i * 30;
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(x, DIAL_CY - DIAL_R + 6); ctx.lineTo(x, DIAL_CY + DIAL_R - 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(DIAL_CX - DIAL_R + 6, y); ctx.lineTo(DIAL_CX + DIAL_R - 6, y); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.beginPath(); ctx.arc(DIAL_CX, DIAL_CY, 30, 0, Math.PI * 2); ctx.stroke();

  // 刻度 + 数字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    const quarter = i % 3 === 0;
    const rIn = DIAL_R - 4 - (quarter ? 16 : 10), rOut = DIAL_R - 4;
    ctx.strokeStyle = quarter ? COL.text : COL.grid;
    ctx.lineWidth = quarter ? 4 : 3;
    ctx.beginPath();
    ctx.moveTo(DIAL_CX + Math.sin(a) * rIn, DIAL_CY - Math.cos(a) * rIn);
    ctx.lineTo(DIAL_CX + Math.sin(a) * rOut, DIAL_CY - Math.cos(a) * rOut);
    ctx.stroke();
    ctx.fillStyle = COL.text;
    ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(i === 0 ? '12' : String(i),
      DIAL_CX + Math.sin(a) * 64, DIAL_CY - Math.cos(a) * 64 + 1);
  }

  drawHands(hA, mA, sA);

  if (!inCeremony) {
    // 上午/下午徽章
    ctx.fillStyle = COL.chip;
    rrect(14, 12, 64, 26, 13); ctx.fill();
    ctx.fillStyle = COL.text; ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(f.pm ? '下午' : '上午', 46, 26);
    // 电量
    ctx.fillStyle = COL.muted; ctx.textAlign = 'right';
    ctx.fillText('电量 87%', 226, 26);
    ctx.textAlign = 'center';
    // 小时面板
    ctx.fillStyle = COL.text; ctx.font = 'bold 46px "Courier New",monospace';
    ctx.fillText(String(f.h12), 104, 262);
    ctx.fillStyle = COL.muted; ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('时', 152, 282);
    // 提示
    ctx.fillStyle = COL.muted;
    ctx.fillText('点击表盘 · 回到过去', 120, 306);
  } else {
    // 仪式:大号提示/短语(回归与结束后隐藏)
    const p = ceremony;
    const ph = ceremonyPhase(performance.now() - p.startMs);
    let label = null;
    if (ph <= 2) label = '"回到过去"';
    else if (ph === 3) label = p.phrase;
    if (label) {
      ctx.fillStyle = COL.text;
      ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(label, 120, 262);
    }
    // 光晕闪烁(FLARE 阶段)
    if (ph === 2 && flashOn) {
      ctx.fillStyle = COL.flash; ctx.fillRect(0, 0, W, H);
    }
  }
}

// ---------- 主循环 ----------
function loop(){
  const now = performance.now();
  if (!ceremony) {
    const f = nowFace();
    draw([f.hourCw, f.minCw, f.secCw]);
    if (!screenOff && now - lastActivity > 45000) {
      screenOff = true;
      sleepCover.style.display = 'flex';
    }
  } else {
    const t = now - ceremony.startMs;
    ceremonyTick(t);
    // 光晕按 100ms 交替
    flashOn = (Math.floor(t / 100) % 2) === 0;
    draw(ceremony ? ceremony.current : null);
  }
  requestAnimationFrame(loop);
}

// ---------- 交互 ----------
function wakeIfOff(){
  if (screenOff) {
    screenOff = false;
    sleepCover.style.display = 'none';
    lastActivity = performance.now();
    return true;   // 本次点击仅唤醒
  }
  return false;
}
function onPress(){
  if (wakeIfOff()) return;
  lastActivity = performance.now();
  if (!actx) return;
  if (actx.state === 'suspended') actx.resume();
  if (ceremony) endCeremony();
  else startCeremony();
}
cv.addEventListener('pointerdown', onPress);
sleepCover.addEventListener('pointerdown', onPress);
document.getElementById('btnAnnounce').addEventListener('click', () => {
  if (wakeIfOff()) return;
  lastActivity = performance.now();
  if (!actx) return;
  if (actx.state === 'suspended') actx.resume();
  const f = nowFace();
  playSequence(announceWords({ h12: f.h12, pm: f.pm, m: f.m }));
});

// ---------- 启动 ----------
loadAudio().then(() => { actx.resume && actx.resume(); });
requestAnimationFrame(loop);
</script>
</body>
